<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Публичные пасты пользователей</title>
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/home_nav.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/home_body.css}">
</head>
<body>
<nav class="navbar">
    <div class="nav-bar">
        <i class="bx bx-menu sidebarOpen"></i>
        <span class="logo navLogo"><a href="#">Pastebin</a></span>

        <div class="menu">
            <div class="logo-toggle">
                <span class="logo"><a href="#">Pastebin</a></span>
                <i class='bx bx-x siderbarClose'></i>
            </div>

            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Publications</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Developer Portfolio</a></li>
                <li><a href="#">Git Hub</a></li>
            </ul>
        </div>

        <div class="darkLight">
            <div class="dark-light">
                <i class='bx bx-moon moon'></i>
                <i class='bx bx-sun sun'></i>
            </div>
        </div>
    </div>
</nav>
<main class="container">
    <h1 style="text-align: center; margin: 20px 0;">Author pastes</h1>
    <div style="display: grid; grid-template-columns: 1fr; gap: 20px; padding: 20px;">
        <div th:each="paste : ${PublicAuthorPastes}">
            <div class="paste-card" style="border: 1px solid #ddd; border-radius: 8px; padding: 15px; background: #fff;">
                <h3 style="margin-top: 0;">
                    <a th:href="@{/{hash}(hash = ${paste.getHash()})}" th:text="${paste.title}">Заголовок пасты</a>
                </h3>
                <p><strong>Author:</strong> <span th:text="${paste.username}">username</span></p>
                <p><strong>Date:</strong> <span th:text="${paste.createdAtRelative}">1 мин назад</span></p>
                <p><strong>Category:</strong> <span th:text="${paste.category}">Code</span></p>
            </div>
        </div>
    </div>
    <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px; padding-bottom: 40px;">
        <a th:if="${currentPage > 0}"
           th:href="@{/author-pastes/{username}/{page}(username=${authorName}, page=${currentPage - 1})}"
           style="text-decoration: none; padding: 10px 20px; background: #007bff; color: white; border-radius: 5px; font-weight: 500;">
            <i class='bx bx-chevron-left'></i> Previous
        </a>
        <span style="font-weight: bold; color: #555;">
            Page <span th:text="${currentPage}">0</span>
        </span>
        <a th:if="${hasNextAuthorPastes}"
           th:href="@{/author-pastes/{username}/{page}(username=${authorName}, page=${currentPage + 1})}"
           style="text-decoration: none; padding: 10px 20px; background: #007bff; color: white; border-radius: 5px; font-weight: 500;">
            Next <i class='bx bx-chevron-right'></i>
        </a>
    </div>
</main>
</body>
<script src="your-script.js"></script>
</html>
